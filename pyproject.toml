[project]
name = "paperbot"
version = "0.1.0"
description = "白纸姐姐的自定义人设 QQ 机器人（基于 NoneBot2）"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
nonebot2 = { version = ">=2.3,<3", extras = ["fastapi", "httpx", "websockets"] }
nonebot-adapter-onebot = ">=2.3,<3"
pydantic-settings = ">=2.0"
sqlalchemy = { version = ">=2.0", extras = ["asyncio"] }
aiosqlite = ">=0.19"
openai = ">=1.30"
pip = "*"

[tool.pixi.tasks]
bot = "python bot.py"
