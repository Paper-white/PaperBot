[project]
name = "paperbot"
version = "0.1.0"
description = "白纸姐姐的自定义人设 QQ 机器人（基于 NoneBot2）"
requires-python = ">=3.11,<3.12"
dependencies = ["playwright>=1.63.0,<2", "markdown>=3.11,<4", "pygments>=2.21.0,<3", "jinja2>=3.1.6,<4", "pymdown-extensions>=12.1,<13", "psutil>=7.2.2,<8"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
nonebot2 = { version = ">=2.3,<3", extras = ["fastapi", "httpx", "websockets"] }
nonebot-adapter-onebot = ">=2.3,<3"
pydantic-settings = ">=2.0"
sqlalchemy = { version = ">=2.0", extras = ["asyncio"] }
aiosqlite = ">=0.19"
openai = ">=1.30"
pip = "*"

[tool.pixi.tasks]
bot = "python bot.py"
new-plugin = "python scripts/new_plugin.py"
check-llm = "python _tests/llm_check.py"
check-config = "python _tests/config_check.py"
check-vcs = "python _tests/vcs_check.py"
